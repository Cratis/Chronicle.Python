[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "cratis-chronicle"
dynamic = ["version"]
description = "Experimental Python client for Cratis Chronicle"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Cratis", email = "post@cratis.io" }]
keywords = ["chronicle", "event-sourcing", "grpc"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "build",
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
    "twine",
]

[project.urls]
Homepage = "https://github.com/Cratis/Chronicle.Python"
Documentation = "https://github.com/Cratis/Chronicle.Python/tree/main/Documentation"
Repository = "https://github.com/Cratis/Chronicle.Python.git"
Issues = "https://github.com/Cratis/Chronicle.Python/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/cratis_chronicle"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=cratis_chronicle --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["cratis_chronicle"]
