[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "cratis-chronicle"
dynamic = ["version"]
description = "Experimental Python client for Cratis Chronicle"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Cratis", email = "post@cratis.io" }]
keywords = [
    "chronicle",
    "cratis",
    "event-sourcing",
    "eventsourcing",
    "event-store",
    "cqrs",
    "ddd",
    "grpc",
    "async",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "grpcio>=1.83.0,<2",
    # Temporary release asset until PyPI trusted publishing is configured.
    "cratis-chronicle-contracts @ https://github.com/Cratis/Chronicle/releases/download/v19.31.3/cratis_chronicle_contracts-19.31.3-py3-none-any.whl#sha256=fcdc4571947f218d59af0ec56ae532032cf3aad2ee504292730735f6cef56fca",
]

[project.optional-dependencies]
dev = [
    "build",
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
    "twine",
]

[project.urls]
Homepage = "https://github.com/Cratis/Chronicle.Python"
Documentation = "https://github.com/Cratis/Chronicle.Python/tree/main/Documentation"
Repository = "https://github.com/Cratis/Chronicle.Python.git"
Issues = "https://github.com/Cratis/Chronicle.Python/issues"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/cratis_chronicle"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=cratis_chronicle --cov-report=term-missing"
testpaths = ["tests"]
markers = ["integration: needs a real Chronicle development kernel; set CHRONICLE_INTEGRATION_URL"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["cratis_chronicle"]

[[tool.mypy.overrides]]
# The generated contracts ship stubs that mypy cannot parse, and grpcio ships none. Both are used through narrow wrappers.
module = ["cratis_chronicle_contracts.*", "grpc", "grpc.*"]
follow_imports = "skip"
ignore_missing_imports = true
